<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenice Resto | Media Kit</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to bottom, #f9fbff 0%, #ffffff 40%);
    color:#222;
    scroll-behavior:smooth;
}

/* MENU SUPERIOR */
nav{
    position:fixed;
    top:0;
    width:100%;
    background:#ffffffee;
    backdrop-filter:blur(10px);
    padding:12px 18px;
    display:flex;
    justify-content:space-between; /* NOMBRE IZQUIERDA, MENÚ DERECHA */
    align-items:center;
    border-bottom:1px solid #e6e6e6;
    z-index:999;
}

nav .logo-text{
    font-weight:bold;
    font-size:20px;
    color:#0077cc;
}

/* BOTÓN HAMBURGUESA */
nav .menu-btn{
    font-size:32px;
    cursor:pointer;
    color:#0077cc;
    border:none;
    background:none;
    text-shadow:0px 0px 3px rgba(0,0,0,0.15);
    margin-right:4px; /* SEPARADO DEL BORDE */
}

nav ul{
    list-style:none;
    padding:0;
    margin:0;
    position:fixed;
    top:60px;
    right:-100%;
    width:60%;
    height:100%;
    background:white;
    box-shadow:-2px 0 10px rgba(0,0,0,0.1);
    transition:0.3s;
    padding-top:20px;
}

nav ul.show{
    right:0;
}

nav ul li{
    padding:15px 20px;
}

nav ul li a{
    color:#0077cc;
    text-decoration:none;
    font-size:18px;
}

/* HEADER */
header{
    text-align:center;
    padding:130px 20px 50px;
    background:#f5f9ff;
    border-bottom:1px solid #e6e6e6;
}

.logo{
    width:140px;
    margin:auto;
    display:block;
}

/* FOTO AESTHETIC */
.hero-img{
    width:220px;
    height:220px;
    border-radius:18px; /* YA NO ES CÍRCULO */
    object-fit:cover;
    margin-top:25px;
    box-shadow:0 8px 28px rgba(0,0,0,0.12); /* SOMBRA SUAVE PREMIUM */
}

h1{
    font-size:34px;
    margin:20px 0 5px;
    letter-spacing:0.5px;
}

.tagline{
    font-size:16px;
    color:#555;
    margin-bottom:20px;
}

.lang-switch{
    margin-top:15px;
}

.lang-btn{
    padding:8px 18px;
    border-radius:30px;
    border:1px solid #0077cc;
    background:#fff;
    color:#0077cc;
    font-size:14px;
    margin:0 5px;
    cursor:pointer;
}

.lang-btn.active{
    background:#0077cc;
    color:#fff;
}

/* SECCIONES */
section{
    padding:50px 20px;
    max-width:900px;
    margin:auto;
}

h2{
    font-size:30px;
    margin-bottom:15px;
    text-align:center;
    letter-spacing:0.5px;
}

.dual{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.dual div{
    flex:1;
    min-width:260px;
}

.package-box,.stats-box{
    background:#f7f7f7;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

/* VIDEOS */
.reels{
    display:flex;
    flex-direction:column;
    gap:30px;
}

.reel-box{
    width:100%;
    height:500px;
    overflow:hidden;
    border-radius:12px;
}

.reel-box iframe{
    width:100%;
    height:100%;
    border:none;
    pointer-events:auto;
}

/* COLORES ALTERNADOS */
.bg-blue{
    background:#eaf5ff;
}

/* GRID DE MARCAS */
.brand-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap:25px;
    align-items:center;
    justify-items:center;
    margin-top:20px;
}

.brand-grid img{
    width:120px;
    height:auto;
    object-fit:contain;
    transition:0.3s;
}

.brand-grid img:hover{
    transform:scale(1.05);
}

/* FOOTER */
footer{
    text-align:center;
    background:#1a1a1a;
    color:#fff;
    padding:40px 20px;
    margin-top:40px;
}

footer a{
    color:#4da3ff;
    text-decoration:none;
}
</style>

<script>
function setLang(lang){
    document.querySelectorAll("[data-es]").forEach(el=>{
        el.innerHTML = lang==="es" ? el.dataset.es : el.dataset.en;
    });
    document.getElementById("btn-es").classList.toggle("active", lang==="es");
    document.getElementById("btn-en").classList.toggle("active", lang==="en");
}

function toggleMenu(){
    document.getElementById("menu").classList.toggle("show");
}
</script>

</head>
