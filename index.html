<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenice Resto | Media Kit</title>

<style>
body{margin:0;font-family:Arial, sans-serif;background:#ffffff;color:#222;transition:0.3s;}
header{text-align:center;padding:40px 20px;}
.logo{width:140px;margin:auto;display:block;}
.hero-img{width:180px;height:180px;border-radius:50%;object-fit:cover;margin-top:20px;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
h1{font-size:36px;margin:15px 0 5px;color:#1a1a1a;}
.tagline{font-size:16px;color:#555;margin-bottom:20px;}
.lang-switch{margin-top:15px;}
.lang-btn{padding:8px 18px;border-radius:30px;border:1px solid #0077cc;background:#fff;color:#0077cc;font-size:14px;margin:0 5px;cursor:pointer;transition:0.3s;}
.lang-btn.active{background:#0077cc;color:#fff;}
section{padding:40px 20px;max-width:900px;margin:auto;}
h2{font-size:28px;margin-bottom:10px;color:#1a1a1a;text-align:center;}
.dual{display:flex;gap:20px;flex-wrap:wrap;margin-top:20px;}
.dual div{flex:1;min-width:260px;}
.package-box,.stats-box{background:#f7f7f7;padding:15px;border-radius:10px;margin-bottom:15px;}
.reels iframe{width:100%;height:450px;border:none;border-radius:10px;margin-bottom:25px;}
footer{text-align:center;background:#1a1a1a;color:#fff;padding:30px 20px;margin-top:40px;}
a{color:#0077cc;text-decoration:none;}
</style>

<script>
function setLang(lang){
    document.querySelectorAll("[data-es]").forEach(el=>{
        el.innerHTML = lang==="es" ? el.dataset.es : el.dataset.en;
    });
    document.getElementById("btn-es").classList.toggle("active", lang==="es");
    document.getElementById("btn-en").classList.toggle("active", lang==="en");
}
</script>

</head>

<body onload="setLang('es')">

<header>
    <img src="IMG_5775.png" class="logo">
    <img src="IMG_8980.jpeg" class="hero-img">
    <h1 data-es="Jenice Resto" data-en="Jenice Resto"></h1>
    <p class="tagline" data-es="Travel & Lifestyle Content Creator" data-en="Travel & Lifestyle Content Creator"></p>

    <div class="lang-switch">
        <button id="btn-es" class="lang-btn" onclick="setLang('es')">ES</button>
        <button id="btn-en" class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
</header>

<section>

     data-en="<h3>ENGLISH</h3><p>I’m Jenice Resto, a travel & lifestyle content creator focused on the Hispanic market across Puerto Rico, LATAM, and the United States. My work blends minimal aesthetics, authentic storytelling, and strategic content designed to inspire, connect, and deliver real results for brands.</p>"></div>

     data-en="<h3>ENGLISH</h3><ul><li>Instagram & TikTok content creation</li><li>Professional UGC content</li><li>Hotel, restaurant & experience promotion</li><li>Modeling and on‑camera presence</li><li>Event coverage</li><li>Product and service reviews</li></ul>"></div>

<div class="package-box" data-es="<h3>Instagram Post (10 fotos)</h3><p>$200</p>"

     data-en="<h3>Instagram Reel + TikTok Video</h3><p>$350</p>"></div>

<div class="package-box" data-es="<h3>Paquete Completo</h3><p>$450</p><p>Stories, fotos y videos exclusivos, Reel y Post</p>"

     data-en="<p><strong>Monthly reach:</strong> 500K views</p><p><strong>Followers:</strong> 23.6K</p><p><strong>Main age:</strong> 25–34 years</p><p><strong>Gender:</strong> 69.9% women · 30.1% men</p><p><strong>Top countries:</strong> LATAM & USA</p>"></div>
