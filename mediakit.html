<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Jenice Resto | Media Kit</title>
    <style>
        body { font-family: sans-serif; background-color: #FAF8F5; margin: 0; padding: 20px; color: #2C2C2C; }
        .container { max-width: 800px; margin: 0 auto; background: #FFF; padding: 30px; border-radius: 8px; }
        .header { text-align: center; margin-bottom: 20px; }
        .name { font-family: serif; font-size: 32px; text-transform: uppercase; margin: 5px 0; }
        .niche { font-size: 10px; letter-spacing: 2px; color: #A67C52; text-transform: uppercase; }
        
        /* Ajuste para que las fotos no se monten */
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }

        /* Sección de Marcas organizada */
        .brand-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #EEE; text-align: center; }
        .brand-title { font-family: serif; font-size: 16px; color: #A67C52; margin-bottom: 10px; }
        .brand-logos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; align-items: center; margin-bottom: 10px; }
        .brand-logos img { width: 100%; height: 40px; object-fit: contain; filter: grayscale(100%); opacity: 0.7; }
        .brand-text { font-size: 11px; font-style: italic; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="name">Jenice Resto</h1>
            <div class="niche">Viajes • Alojamientos • Gastronomía • Experiencias</div>
        </header>

        <section class="gallery">
            <img src="IMG_5332.jpeg">
            <img src="IMG_6476.jpeg">
            <img src="IMG_1775.jpeg">
        </section>

        <section class="brand-section">
            <div class="brand-title">Marcas y Colaboraciones</div>
            <div class="brand-logos">
                <img src="IMG_5686.png">
                <img src="IMG_6086.png">
                <img src="IMG_6088.png">
                <img src="IMG_6093.png">
            </div>
            <p class="brand-text">Más de 300 colaboraciones exitosas con marcas locales e internacionales.</p>
        </section>
    </div>
</body>
</html>
